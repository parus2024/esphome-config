Итого:

time.toshiba_ac_night_on — это встроенная сущность time компонента datetime устройства №1 (не input_datetime в HA).
Нужно из устройства №2 (ESPHome + LVGL) послать обновлённое время именно в эту сущность time.toshiba_ac_night_on устройства №1.
При этом прямое изменение time сущности из ESPHome невозможно, т.к. time — это датчик времени, а не управляемый объект.
Устройства №1 и №2 связаны через HA, и есть HA как посредник.

Что происходит
text_sensor получает строку времени из HA, например "21:30:00".
В on_value парсим строку и форматируем HH:MM.
Вызываем lv_label_set_text() для обновления текста лейбла сразу.

Да, идея вполне рабочая и логичная! Вот как это можно организовать:

Твой план в деталях
В устройстве 2:

Не хранить локальный datetime для отображаемого времени.
Отображать время в LVGL-лейбле, который можно редактировать вручную (например, через сенсорный ввод или кнопки).
При изменении времени пользователем — парсить введённое значение и записывать его в локальный datetime (если нужно, например, для внутренней логики, таймеров или отображения).
Для синхронизации с Home Assistant:

После ручного изменения времени в устройстве 2 — вызывать сервис HA, который обновит time.toshiba_ac_night_on (или другой input_datetime в HA).
В HA настроить автоматизацию, которая при изменении input_datetime вызовет сервис ESPHome устройства 1 и обновит там datetime.time.set.
Обратная синхронизация:

Если время меняется в HA или устройстве 1, устройство 2 получает обновление через подписку на platform: homeassistant и обновляет лейбл, чтобы всегда показывать актуальное время.
