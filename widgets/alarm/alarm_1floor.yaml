switch:
# Уведомление движения первый этаж
  - platform: homeassistant
    id: my_alarm_alert_1floor
    entity_id: "${alarm_alert_1floor}"
    on_turn_on:
      - lvgl.label.update:
          id: alarm_alert_1floor_btn_label
          text_color: color_deep_orange
          text: "${alert}"
    on_turn_off:
      - lvgl.label.update:
          id: alarm_alert_1floor_btn_label
          text_color: color_misty_blue
          text: "${alert_off}"
# Движение выключатель
  - platform: homeassistant
    id: my_switch_alarm_motion_1floor
