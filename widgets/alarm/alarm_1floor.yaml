substitutions:
  alarm_alert_1floor: "automation.alarm_1floor" # Сигнализация 1 этаж
  alarm_siren_1floor: "switch.security_siren" # Сирена первый этаж
  alarm_motion_1floor: "binary_sensor.security_motion" # Движение первый этаж
  alarm_moisture_kitchen_1floor: "binary_sensor.osmos_moisture" # Протечка кухня первый этаж
  alarm_moisture_coffee: "binary_sensor.coffee_ws2812_moisture" # Протечка кофейный столикпервый этаж
  alarm_smoke_1floor: "binary_sensor.security_smoke" # Дым первый этаж
  alarm_gas_1floor: "binary_sensor.bridge_rf_ir_1floor_gas_kitchen" # Газ первый этаж

  switch_alarm_motion_1floor: "switch.security_motion_switch" # выключатель Движение первый этаж
  switch_alarm_moisture_kitchen_1floor: "switch.osmos_moisture_switch" # выключатель Протечка кухня первый этаж
  switch_alarm_moisture_coffee: "switch.coffee_ws2812_moisture_switch" # выключатель протечка кофе первый этаж
  switch_alarm_smoke_1floor: "switch.security_smoke_switch" # выключатель Дым первый этаж
  switch_alarm_gas_1floor: "input_boolean.gas_kitchen" # выключатель первый этаж

binary_sensor:
# Движение первый этаж датчик
  - platform: homeassistant
    id: my_alarm_motion_1floor
    entity_id: "${alarm_motion_1floor}"
    on_press:
      - lvgl.label.update:
          id: alarm_motion_1floor_btn_label
          text_color: color_deep_orange
          text: "${motion_sensor}"
    on_release:
      - if:
          condition:
            lambda: 'return id(my_switch_alarm_motion_1floor).state;'
          then:
            - lvgl.label.update:
                id: alarm_motion_1floor_btn_label
                text_color: green
                text: "${motion_sensor_off}"
          else:
            - lvgl.label.update:
                id: alarm_motion_1floor_btn_label
                text_color: color_misty_blue
                text: "${motion_sensor_off}"
# Газ первый этаж датчик
  - platform: homeassistant
    id: my_alarm_gas_1floor
    entity_id: "${alarm_gas_1floor}"
    on_press:
      - lvgl.label.update:
          id: alarm_gas_1floor_btn_label
          text_color: color_deep_orange
          text: "${smoke_alert}"
    on_release:
      - if:
          condition:
            lambda: 'return id(my_switch_alarm_gas_1floor).state;'
          then:
            - lvgl.label.update:
                id: alarm_gas_1floor_btn_label
                text_color: green
                text: "${smoke}"
          else:
            - lvgl.label.update:
                id: alarm_gas_1floor_btn_label
                text_color: color_misty_blue
                text: "${smoke}"
# Дым первый этаж датчик
  - platform: homeassistant
    id: my_alarm_smoke_1floor
    entity_id: "${alarm_smoke_1floor}"
    on_press:
      - lvgl.label.update:
          id: alarm_smoke_1floor_btn_label
          text_color: color_deep_orange
          text: "${fire}"
    on_release:
      - if:
          condition:
            lambda: 'return id(my_switch_alarm_smoke_1floor).state;'
          then:
            - lvgl.label.update:
                id: alarm_smoke_1floor_btn_label
                text_color: green
                text: "${fire}"
          else:
            - lvgl.label.update:
                id: alarm_smoke_1floor_btn_label
                text_color: color_misty_blue
                text: "${fire}"
# Протечка мойка первый этаж датчик
  - platform: homeassistant
    id: my_alarm_moisture_kitchen_1floor
    entity_id: "${alarm_moisture_kitchen_1floor}"
    on_press:
      - lvgl.label.update:
          id: alarm_moisture_kitchen_1floor_btn_label
          text_color: color_deep_orange
          text: "${water_alert}"
    on_release:
      - if:
          condition:
            lambda: 'return id(my_switch_alarm_moisture_kitchen_1floor).state;'
          then:
            - lvgl.label.update:
                id: alarm_moisture_kitchen_1floor_btn_label
                text_color: green
                text: "${water_off}"
          else:
            - lvgl.label.update:
                id: alarm_moisture_kitchen_1floor_btn_label
                text_color: color_misty_blue
                text: "${water_off}"
# Протечка кофе первый этаж датчик
