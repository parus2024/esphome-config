binary_sensor:
  # Движение датчик
  - platform: homeassistant
    id: my_alarm_motion_${room_number}
    entity_id: "binary_sensor.alarm_${room_number}_motion"
    on_press:
      - lvgl.label.update:
          id: alarm_motion_${room_number}_btn_label
          text_color: color_deep_orange
          text: "${motion_sensor}"
    on_release:
      - if:
          condition:
            lambda: 'return id(my_switch_alarm_motion_${room_number}).state;'
          then:
            - lvgl.label.update:
                id: alarm_motion_${room_number}_btn_label
                text_color: green
                text: "${motion_sensor_off}"
          else:
            - lvgl.label.update:
                id: alarm_motion_${room_number}_btn_label
                text_color: color_misty_blue
                text: "${motion_sensor_off}"

  # Газ датчик
  - platform: homeassistant
    id: my_alarm_gas_${room_number}
    entity_id: "binary_sensor.bridge_rf_ir_1floor_gas_${room_number}"
    on_press:
      - lvgl.label.update:
          id: alarm_gas_${room_number}_btn_label
          text_color: color_deep_orange
          text: "${smoke_alert}"
    on_release:
      - if:
          condition:
            lambda: 'return id(my_input_boolean_alarm_gas_${room_number}).state;'
          then:
            - lvgl.label.update:
                id: alarm_gas_${room_number}_btn_label
                text_color: green
                text: "${smoke}"
          else:
            - lvgl.label.update:
                id: alarm_gas_${room_number}_btn_label
                text_color: color_misty_blue
                text: "${smoke}"

  # Дым датчик
  - platform: homeassistant
    id: my_alarm_smoke_${room_number}
    entity_id: "binary_sensor.smoke_${room_number}"
    on_press:
      - lvgl.label.update:
          id: alarm_smoke_${room_number}_btn_label
          text_color: color_deep_orange
          text: "${fire}"
    on_release:
      - if:
          condition:
            lambda: 'return id(my_switch_alarm_smoke_${room_number}).state;'
          then:
            - lvgl.label.update:
                id: alarm_smoke_${room_number}_btn_label
                text_color: green
                text: "${fire}"
          else:
            - lvgl.label.update:
                id: alarm_smoke_${room_number}_btn_label
                text_color: color_misty_blue
                text: "${fire}"

  # Протечка мойка датчик
  - platform: homeassistant
    id: my_alarm_moisture_kitchen_${room_number}
    entity_id: "binary_sensor.moisture_kitchen_${room_number}"
    on_press:
      - lvgl.label.update:
          id: alarm_moisture_kitchen_${room_number}_btn_label
          text_color: color_deep_orange
          text: "${water_alert}"
    on_release:
      - if:
          condition:
            lambda: 'return id(my_input_boolean_alarm_moisture_kitchen_${room_number}).state;'
          then:
            - lvgl.label.update:
                id: alarm_moisture_kitchen_${room_number}_btn_label
                text_color: green
                text: "${water_off}"
          else:
            - lvgl.label.update:
                id: alarm_moisture_kitchen_${room_number}_btn_label
                text_color: color_misty_blue
                text: "${water_off}"

  # Протечка душ датчик
  - platform: homeassistant
    id: my_alarm_moisture_shower_${room_number}
    entity_id: "binary_sensor.moisture_shower_${room_number}"
    on_press:
      - lvgl.label.update:
          id: alarm_moisture_shower_${room_number}_btn_label
          text_color: color_deep_orange
          text: "${water_alert}"
    on_release:
      - if:
          condition:
            lambda: 'return id(my_input_boolean_alarm_moisture_shower_${room_number}).state;'
          then:
            - lvgl.label.update:
                id: alarm_moisture_shower_${room_number}_btn_label
                text_color: green
                text: "${water_off}"
          else:
            - lvgl.label.update:
                id: alarm_moisture_shower_${room_number}_btn_label
                text_color: color_misty_blue
                text: "${water_off}"

switch:
  # Уведомление движения
  - platform: homeassistant
    id: my_alarm_alert_${room_number}
    entity_id: "automation.alarm_motion_${room_number}"
    on_turn_on:
      - lvgl.label.update:
          id: alarm_alert_${room_number}_btn_label
          text_color: color_deep_orange
          text: "${alert}"
    on_turn_off:
      - lvgl.label.update:
          id: alarm_alert_${room_number}_btn_label
          text_color: color_misty_blue
          text: "${alert_off}"

  # Движение выключатель
  - platform: homeassistant
    id: my_switch_alarm_motion_${room_number}
    entity_id: "switch.alarm_${room_number}_motion"
    on_turn_on:
      - lvgl.label.update:
          id: alarm_motion_${room_number}_btn_label
          text_color: green
          text: "${motion_sensor_off}"
    on_turn_off:
      - lvgl.label.update:
          id: alarm_motion_${room_number}_btn_label
          text_color: color_misty_blue
          text: "${motion_sensor_off}"

  # Сирена
  - platform: homeassistant
    id: my_alarm_siren_${room_number}
    entity_id: "switch.alarm_${room_number}_siren"
    on_turn_on:
      - lvgl.label.update:
          id: alarm_siren_${room_number}_btn_label
          text_color: color_deep_orange
          text: "${alarm_on}"
    on_turn_off:
      - lvgl.label.update:
          id: alarm_siren_${room_number}_btn_label
          text_color: green
          text: "${alarm_off}"

  # Газ выключатель
  - platform: homeassistant
    id: my_input_boolean_alarm_gas_${room_number}
    entity_id: "input_boolean.gas_${room_number}"
    on_turn_on:
      - lvgl.label.update:
          id: alarm_gas_${room_number}_btn_label
          text_color: green
    on_turn_off:
      - lvgl.label.update:
          id: alarm_gas_${room_number}_btn_label
          text_color: color_misty_blue

  # Дым выключатель
  - platform: homeassistant
    id: my_switch_alarm_smoke_${room_number}
    entity_id: "switch.alarm_${room_number}_smoke"
    on_turn_on:
      - lvgl.label.update:
          id: alarm_smoke_${room_number}_btn_label
          text_color: green
          text: "${fire}"
    on_turn_off:
      - lvgl.label.update:
          id: alarm_smoke_${room_number}_btn_label
          text_color: color_misty_blue
          text: "${fire}"

  # Протечка кухня выключатель
  - platform: homeassistant
    id: my_input_boolean_alarm_moisture_kitchen_${room_number}
    entity_id: "input_boolean.moisture_kitchen_${room_number}"
    on_turn_on:
      - lvgl.label.update:
          id: alarm_moisture_kitchen_${room_number}_btn_label
          text_color: green
    on_turn_off:
      - lvgl.label.update:
          id: alarm_moisture_kitchen_${room_number}_btn_label
          text_color: color_misty_blue

  # Протечка душ выключатель
  - platform: homeassistant
    id: my_input_boolean_alarm_moisture_shower_${room_number}
    entity_id: "input_boolean.moisture_shower_${room_number}"
    on_turn_on:
      - lvgl.label.update:
          id: alarm_moisture_shower_${room_number}_btn_label
          text_color: green
    on_turn_off:
      - lvgl.label.update:
          id: alarm_moisture_shower_${room_number}_btn_label
          text_color: color_misty_blue

lvgl:
  pages:
    - id: alarm_${room_number}_page
      bg_color: color_slate_blue_gray
      widgets:
        # Кнопка Alarm Alert
