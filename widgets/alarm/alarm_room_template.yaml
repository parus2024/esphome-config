            width: 235
            align: top_left
            x: 5
            y: 5
            bg_color: color_steel_blue
            bg_opa: 30%
            border_opa: 50%
            border_color: color_misty_blue
            border_width: 2
            shadow_opa: transp
            pad_all: 5
            widgets:
              - label:
                  id: alarm_alert_${room_number}_btn_label
                  y: -20
                  align: CENTER
                  text_color: darkgreen
                  text_font: mdi_icons_96
                  text: "${alert}"
