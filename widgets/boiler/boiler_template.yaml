                    - switch.toggle: switch_boiler_${room_number}_ten1_local
#                    - homeassistant.action:
#                        action: switch.toggle
#                        data:
#                          entity_id: "${boiler_${room_number}_ten1}"

              - obj:
                  id: boiler_${room_number}_ten2_bg # Кнопка вкл\выкл ТЕН 2
                  x: 35
                  y: 60
                  align: left_mid
                  width: 70
                  height: 70
                  radius: 35
                  pad_all: 0
                  bg_color: color_deep_orange
                  bg_opa: 20%
                  shadow_opa: transp
                  border_opa: transp
                  border_width: 0
                  widgets:
                    - label:
                        id: boiler_${room_number}_ten2_icon
                        align: center
                        text_font: mdi_icons_40
                        text_color: color_deep_orange
                        text: "${heating_coil_icon}"
                    - label:
                        id: boiler_${room_number}_ten2_icon_label
                        x: -55
                        align: RIGHT_MID
                        text_font: nunito_20
                        text_color: color_misty_blue
