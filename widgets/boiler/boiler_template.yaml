      - lvgl.meter.update:
          id: boiler_${room_number}_meter
          text_color: color_steel_blue
      - lvgl.label.update:
          id: heating_status
          text_color: color_steel_blue
      - lvgl.label.update:
          id: boiler_${room_number}_state_icon
          text_color: color_steel_blue
      - lvgl.label.update:
          id: boiler_${room_number}_target_temperature_icon
          text_color: color_steel_blue
      - lvgl.label.update:
          id: boiler_${room_number}_target_temperature_value
          text_color: color_steel_blue
      - lvgl.label.update:
          id: boiler_${room_number}_target_temperature_whole
          text_color: color_steel_blue
      - lvgl.label.update:
          id: boiler_${room_number}_target_temperature_fraction
          text_color: color_steel_blue
      - lvgl.label.update:
          id: boiler_${room_number}_target_temperature_measurement
          text_color: color_steel_blue
      - lvgl.label.update:
          id: boiler_page_btn_label
          text_color: color_steel_blue

switch:
