                    - range_from: 10
                      range_to: 80
                      angle_range: 160
                      rotation: 100.0
                      ticks:
                        width: 1
                        count: 70 # Количество деление на диапазон
                        length: 10
                        color: color_white
                        major:
                          stride: 10  # крупная метка каждые 5 делений
                          width: 5
                          length: 15
                          color: color_white
                          label_gap: 15
                      indicators:
                        - tick_style:
                            start_value: 10
                            end_value: 80
                            color_start: color_yellow #Цвет снизу
                            color_end: color_red # Цвет сверху
                            width: 1

              - arc:
                  id: boiler_${room_number}_arc_main
                  clickable: false
                  align: RIGHT_MID
                  arc_width: 40
                  x: 235
                  width: 470
                  height: 470
                  min_value: 10
                  max_value: 80
                  adjustable: true
                  adv_hittest: true
                  rotation: 90.0
                  start_angle: 10
                  end_angle: 170
                  arc_opa: TRANSP
                  indicator:
                    arc_opa: TRANSP
                    arc_width: 40
                  knob:
                    border_color: color_misty_blue
                    border_width: 5
                    bg_color: color_dark_gray
                    bg_opa: 80%

              - arc:
                  id: boiler_${room_number}_arc_alarm_temp
                  clickable: false
                  align: RIGHT_MID
                  arc_width: 10
                  x: 230
                  width: 450
                  height: 450
                  min_value: 10
                  max_value: 80
                  adjustable: true
                  adv_hittest: true
                  rotation: 90.0
                  start_angle: 10
                  end_angle: 170
                  arc_opa: TRANSP
                  indicator:
                    arc_opa: TRANSP
                  knob:
                    bg_color: color_gray
                    border_width: 0
                    bg_opa: 80%
#                  on_release:
#                    - homeassistant.action:
#                        action: number.set
#                        data:
#                          entity_id: number.boiler_${room_number}_water_alarm
#                          value: !lambda return x;

              - obj:
                  width: 140
                  height: 120
                  align: RIGHT_MID
                  bg_color: color_slate_blue_gray
                  pad_all: 0
                  border_opa: TRANSP
                  border_width: 0
                  shadow_opa: TRANSP
                  widgets:

                    - label:
                        id: boiler_${room_number}_target_temperature_whole # Температура переграва -отключение
                        x: -40
                        y: 0
                        align: RIGHT_MID
                        text_font: nunito_84
                        text_color: color_steel_blue
                        text: " "
                
                    - label:
                        id: boiler_${room_number}_target_temperature_fraction # Температура переграва -отключение
                        x: -10
                        y: 15
                        align: RIGHT_MID
                        text_font: nunito_36
                        text_color: color_steel_blue
                        text: " "

                    - label:
                        id: boiler_${room_number}_target_temperature_measurement
                        x: -12
                        y: -20
                        align: RIGHT_MID
                        text_font: nunito_30
                        text_color: color_steel_blue
                        text: "°C"

              - label:
                  id: boiler_${room_number}_state_icon
                  x: -10
                  y: -90
                  align: RIGHT_MID
                  text_font: mdi_icons_52
                  text_color: color_steel_blue
                  text: "${heating_coil_icon}"

              - label:
                  id: boiler_${room_number}_target_temperature_icon
                  x: -70
                  y: 80
                  align: RIGHT_MID
                  text_font: icons_28
                  text_color: color_steel_blue
                  text: "${temperature_icon}"

              - label:
                  id: boiler_${room_number}_target_temperature_value # Текущая температура бойлера
                  x: -10
                  y: 80
                  align: RIGHT_MID
                  text_font: nunito_30
                  text_color: color_steel_blue
                  text: " "

        # Return
        - button:
            id: boiler_${room_number}_back
            x: 20
            y: 400
            width: 60
            height: 60
            align: TOP_LEFT
            bg_color: color_steel_blue
            bg_opa: 20%
            shadow_opa: TRANSP
            radius: 10
            widgets:
              - label:
                  id: boiler_${room_number}_back_label
                  align: CENTER
                  text_font: icons_28
                  text_color: color_misty_blue
                  text: "${exit_icon}"
            on_press:
              - lvgl.page.show: boiler_panel_page

