    entity_id: "switch.boiler_${room_number}_full_on"
    on_turn_on:
      - lvgl.label.update:
          id: boiler_${room_number}_full_mode_icon
          text_color: color_deep_orange
    on_turn_off:
      - lvgl.label.update:
          id: boiler_${room_number}_full_mode_icon
          text_color: color_misty_blue
lvgl:
  gradients:
    - id: boiler_${room_number}_temp_gradient
      direction: ver
      dither: none
      stops:
        - color: 0xFF0000   # красный (вверху)
          position: 0
        - color: 0xFF3300
          position: 32
        - color: 0xFF6600
          position: 64
        - color: 0xFF9900
          position: 96
        - color: 0xFFFF00   # жёлтый (середина)
          position: 128
        - color: 0xCCCC33
          position: 160
        - color: 0x666699
          position: 192
        - color: 0x3333CC
          position: 224
        - color: 0x0000FF   # синий (внизу)
          position: 255

  pages:
    - id: boiler_${room_number}_page
      bg_color: color_slate_blue_gray
      widgets:
        # Объект с идикатором мощности
        - obj:
            id: boiler_${room_number}_power_bg
            x: 10
            y: 10
            width: 170
            height: 70
            align: top_left
            pad_all: 0
            bg_color: color_steel_blue
            bg_opa: 20%
            border_opa: transp
            border_width: 0
            shadow_opa: transp
            radius: 10
            widgets:
              - label:
                  id: boiler_${room_number}_power_icon_label
                  x: 5                            # Делаем небольшой отступ слева
                  align: left_mid
                  text_font: mdi_icons_40
                  text_color: color_misty_blue
                  text: "${power_icon}"
              - label:
                  id: boiler_${room_number}_power_state_label
                  x: 50                             # Делаем отступ от значка
                  align: left_mid
                  text_font: nunito_30
                  text_color: color_misty_blue
                  text: " "                         # Передаем данные из сенсора

        # Объект с идикатором напряжения
        - obj:
            id: boiler_${room_number}_voltage_bg
            x: 190
            y: 10
            width: 180
            height: 70
            align: top_left
            pad_all: 0
            bg_color: color_steel_blue
            bg_opa: 20%
            border_opa: transp
            border_width: 0
            shadow_opa: transp
            radius: 10
            widgets:
              - label:
                  id: boiler_${room_number}_voltage_icon_label
                  x: 5                             # Делаем небольшой отступ слева
                  align: left_mid
                  text_font: mdi_icons_40
                  text_color: color_misty_blue
                  text: "${voltage_icon}"
              - label:
                  id: boiler_${room_number}_voltage_state_label
                  x: 50                             # Делаем отступ от значка
                  align: left_mid
                  text_font: nunito_30
                  text_color: color_misty_blue
                  text: " "                         # Пустое поле, передадим действием

        # Состояние тенов и управление ими
        - obj:
            id: boiler_${room_number}_ten_controls
            x: 100
            y: 100
            width: 260
            height: 280
            align: TOP_LEFT
            pad_all: 0
            bg_color: color_steel_blue
            bg_opa: 20%
            border_opa: TRANSP
            border_width: 0
            shadow_opa: TRANSP
            radius: 10
            widgets:
              - obj:
                  id: boiler_${room_number}_ten1_bg # Кнопка вкл\выкл ТЕН 1
                  x: 35
                  y: -60
                  align: left_mid
                  width: 70
                  height: 70
                  radius: 35
                  pad_all: 0
                  bg_color: color_deep_orange
                  bg_opa: 20%
                  shadow_opa: transp
                  border_opa: transp
                  border_width: 0
                  widgets:
                    - label:
                        id: boiler_${room_number}_ten1_icon
                        align: center
                        text_font: mdi_icons_40
                        text_color: color_deep_orange
                        text: "${heating_coil_icon}"
                    - label:
                        id: boiler_${room_number}_ten1_icon_label
                        x: -55
                        align: RIGHT_MID
                        text_font: nunito_20
                        text_color: color_misty_blue
                        text: "1"
