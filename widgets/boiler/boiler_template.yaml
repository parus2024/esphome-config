
sensor:
    # Значение мощности
  - platform: homeassistant
    id: boiler_${room_number}_sensor_power
    entity_id: "sensor.power_boiler_${room_number}"
    on_value:
      - lvgl.label.update:
          id: boiler_${room_number}_power_state_label
          text: !lambda |-
            if (isnan(x)) return "N/A";
            char buf[16];
            snprintf(buf, sizeof(buf), "%.0f W", x);
            return buf;
    # Значение напряжения
  - platform: homeassistant
    id: boiler_${room_number}_sensor_voltage
    entity_id: "sensor.voltage_boiler_${room_number}"
    on_value:
      - lvgl.label.update:
          id: boiler_${room_number}_voltage_state_label
          text: !lambda |-
            if (isnan(x)) return "N/A";
            char buf[16];
            snprintf(buf, sizeof(buf), "%.0f V", x);
            return buf;

  # boiler_${room_number} temperature sensor
  - platform: homeassistant
    id: boiler_${room_number}_temperature_sensor
    entity_id: "sensor.boiler_${room_number}_temperature"

  # Текущая Температура бойлера
  - platform: homeassistant
    id: boiler_${room_number}_sensor_target_temp
    entity_id: "sensor.boiler_${room_number}_temperature"
    on_value: 
      then:
        - lvgl.arc.update:
            id: boiler_${room_number}_arc_main
            value: !lambda 'return x;'

        - lvgl.label.update:
            id: boiler_${room_number}_target_temperature_whole
            text: !lambda |-
              static char buf[10];
              int whole_part = static_cast<int>(id(boiler_${room_number}_sensor_target_temp).state);
              snprintf(buf, 10, "%d", whole_part);
              return buf;

        - lvgl.label.update:
            id: boiler_${room_number}_target_temperature_fraction
            text: !lambda |-
              static char buf[10];
              int whole_part = static_cast<int>(id(boiler_${room_number}_sensor_target_temp).state);
              int fractional_part = static_cast<int>((id(boiler_${room_number}_sensor_target_temp).state - whole_part) * 10);
              snprintf(buf, 10, ".%01d", fractional_part);
              return buf;
        - lvgl.indicator.update: # Для страница boiler_panel
            id: boiler_${room_number}_temperature_needle 
            value: !lambda 'return x;'
        - lvgl.label.update: # Для страница boiler_panel
            id: boiler_${room_number}_btn_temperature_text_label
            text:
              format: "%.0f°C"
              args: ['x']
  # температура бойлера перегрев авария
  - platform: homeassistant
    id: boiler_${room_number}_sensor_current_temp
    entity_id: "number.boiler_${room_number}_water_alarm"
    on_value:
      - lvgl.label.update:
          id: boiler_${room_number}_target_temperature_value
          text: !lambda |-
            char buf[8]; 
            sprintf(buf, "%.1f", x); 
            return std::string(buf);
      - lvgl.arc.update:
          id: boiler_${room_number}_arc_alarm_temp
          value: !lambda 'return x;'
