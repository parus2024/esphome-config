substitutions:
  musor: "automation.vynesti_musor"
  pills_20_00: "automation.vypit_tabletku_ot_davleniia_v_20_00"
  pills_22_00: "automation.ire_vypit_tabletki_v_22_00"
  alert_1bar: "input_boolean.alert_water_1bar"

packages:
  musor: !include
    file: checked_switch_template.yaml
    vars:
      checked_id: "${musor}"
      checked_name: "musor"
  pills_20_00: !include
    file: checked_switch_template.yaml
    vars:
      checked_id: "${pills_20_00}"
      checked_name: "pills_20_00"
  pills_22_00: !include
    file: checked_switch_template.yaml
    vars:
      checked_id: "${pills_22_00}"
      checked_name: "pills_22_00"
  alert_1bar: !include
    file: checked_switch_template.yaml
    vars:
      checked_id: "${alert_1bar}"
      checked_name: "alert_1bar"

lvgl:
  pages:
    - id: checked_page
      bg_color: color_slate_blue_gray
      widgets:
    # напоминания
        - obj:
            id: mess
            x: 10
            y: 10
            width: 230
            height: 380
            align: TOP_LEFT
            pad_all: 0
            bg_color: color_steel_blue
            bg_opa: 20%
            border_opa: TRANSP
            border_width: 0
            shadow_opa: TRANSP
            radius: 10
            widgets:
              - label:
                  y: 0
                  align: TOP_MID
                  id: messag_label
                  text_font: nunito_16
                  text_color: color_misty_blue
                  text: "Напоминания"
              - checkbox:
                  x: 25
                  y: 25
                  id: musor_label
                  text_font: nunito_20
                  text: Мусор пятница
                  on_value:
                    then:
                      - if:
                          condition:
                            - lambda: return x;
                          then:
                            - homeassistant.action:
                                action: automation.turn_on
                                data:
                                  entity_id: "${musor}"
                          else:
                            - homeassistant.action:
                                action: automation.turn_off
                                data:
                                  entity_id: "${musor}"
              - checkbox:
                  x: 25
                  y: 60
                  id: pills_20_00_label
                  text_font: nunito_20
                  text: Таблетки 20:00
                  on_value:
                    then:
                      - if:
                          condition:
                            - lambda: return x;
                          then:
                            - homeassistant.action:
                                action: automation.turn_on
                                data:
                                  entity_id: "${pills_20_00}"
                          else:
                            - homeassistant.action:
                                action: automation.turn_off
                                data:
                                  entity_id: "${pills_20_00}"
              - checkbox:
                  x: 25
                  y: 95
                  id: pills_22_00_label
                  text_font: nunito_20
                  text: Таблетки 22:00
                  on_value:
                    then:
                      - if:
                          condition:
                            - lambda: return x;
                          then:
                            - homeassistant.action:
                                action: automation.turn_on
                                data:
                                  entity_id: "${pills_22_00}"
                          else:
                            - homeassistant.action:
                                action: automation.turn_off
                                data:
                                  entity_id: "${pills_22_00}"
    # тревожные сообщения
        - obj:
            id: alarm_message
            x: 250
            y: 10
            width: 230
            height: 380
            align: TOP_LEFT
            pad_all: 0
            bg_color: color_steel_blue
            bg_opa: 20%
            border_opa: TRANSP
            border_width: 0
            shadow_opa: TRANSP
            radius: 10
            widgets:
              - label:
                  y: 0
                  align: TOP_MID
                  id: alarm_message_label
                  text_font: nunito_16
                  text_color: color_misty_blue
                  text: "Тревожные сообщения"
              - checkbox:
                  x: 25
                  y: 25
                  id: alert_1bar_label
                  text_font: nunito_20
                  text: Давление 1 bar
                  on_value:
                    then:
                      - if:
                          condition:
                            - lambda: return x;
                          then:
                            - homeassistant.action:
                                action: input_boolean.turn_on
                                data:
                                  entity_id: "${alert_1bar}"
                          else:
                            - homeassistant.action:
                                action: input_boolean.turn_off
                                data:
                                  entity_id: "${alert_1bar}"


        # Return
        - button:
            x: 10
            y: 410
            width: 60
            height: 60
            align: TOP_LEFT
            bg_color: color_steel_blue
            bg_opa: 20%
            border_opa: TRANSP
            shadow_opa: TRANSP
            radius: 10
            widgets:
              - label:
                  align: CENTER
                  text_font: icons_28
                  text_color: color_misty_blue
                  text: "${exit_icon}"
            on_press:
              - lvgl.page.show: home_page
              - lvgl.widget.show: menu_controls_main