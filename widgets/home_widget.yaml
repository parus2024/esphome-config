  boiler_icon:             "\U0000e800" # boiler
  gate0_icon:              "\U0000e801" # gate0
  gate25_icon:             "\U0000e802" # gate25
  gate50_icon:             "\U0000e803" # gate50
  gate75_icon:             "\U0000e804" # gate75
  gate100_icon:            "\U0000e805" # gate100
  hood_icon:               "\U0000e806" # hood
  irrigation_icon:         "\U0000e807" # irrigarion
  lamp1_icon:              "\U0000e808" # lamp1
  rgb_bulb_on:             "\U0000e809" # rgb-bulb-on
  rgb_bulb_off:            "\U0000e80a" # rgb-bulb-off
  sauna1_icon:             "\U0000e80b" # sauna1
  sauna2_icon:             "\U0000e80c" # sauna2
  sauna3_icon:             "\U0000e80d" # sauna3
  spotlight_on_icon:       "\U0000e80e" # spotlight-on
  spotlight_off_icon:      "\U0000e80f" # spotlight-off
  led_strip_icon:          "\U0000e810" # led-strip
  atm_pressure_icon:       "\U0000e811" # atm-pressure
  sauna4_icon:             "\U0000e812" # sauna4
  hood1_icon:              "\U0000e813" # hood1
  sauna5_icon:             "\U0000e814" # sauna5
