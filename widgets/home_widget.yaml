globals:
  - id: display_lock
    type: bool
    restore_value: true
    initial_value: "false"

sensor:
  # WI-FI Signal
  - platform: wifi_signal
    id: wifi_signal_percent
    update_interval: 30s
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: "%"
    on_value:
      then:
        - lvgl.label.update:
            id: wifi_status
            text_color: !lambda |-
              if (id(wifi_signal_percent).state > 0) {
              return lv_color_hex(0x5CA848);
              }
              return lv_color_hex(0x5CA848);
            text: !lambda |-
              if (id(wifi_signal_percent).state > 0 && id(wifi_signal_percent).state < 26) {
              return "${wifi_25_icon}";
              } else if (id(wifi_signal_percent).state > 25 && id(wifi_signal_percent).state < 51) {
              return "${wifi_50_icon}";
              } else if (id(wifi_signal_percent).state > 50 && id(wifi_signal_percent).state < 76) {
              return "${wifi_75_icon}";
              } else if (id(wifi_signal_percent).state > 75) {
              return "${wifi_100_icon}";
              }
              return "${wifi_100_icon}";

  # Weather temperature sensor
  - platform: homeassistant
    id: weather_temp
    entity_id: "${weather_entity}"
    attribute: temperature
    on_value: 
      then:
        - lvgl.label.update:
            id: weather_temperature
            text:
              format: "%.0f°"
              args: [x]

  # Temperature Home Sensor
  - platform: homeassistant
    id: temperature_sensor
    entity_id: "${temperature_entity}"
    on_value:
      then:   
        - lvgl.label.update:
            id: temperature_sensor_label
            text:
              format: "%.1f °C"
              args: [x]
  # Temperature Sauna Sensor
  - platform: homeassistant
    id: sauna_temperature_sensor
    entity_id: "${sauna_temperature}"
    on_value:
      then:   
        - lvgl.label.update:
            id: sauna_temperature_label
            text:
              format: "%.0f °C"
              args: [x]

  # Humidity Home Sensor
  - platform: homeassistant
    id: humidity_sensor
    entity_id: "${humidity_entity}"
    on_value:
      then:
        - lvgl.label.update:
            id: humidity_sensor_label
            text:
              format: "%.0f %%" 
              args: [x]
  # Atmosthere Home Sensor
  - platform: homeassistant
    id: atm_sensor_local
    entity_id: "${atm_entity}"
    on_value:
      then:
        - lvgl.label.update:
            id: atm_sensor_label
            text:
              format: "%.0f mmHg" 
              args: [x]
  # Wind Speed Sensor
  - platform: homeassistant
    id: wind_speed_local
    entity_id: "${wind_speed}"
    on_value:
      then:
        - lvgl.label.update:
            id: wind_speed_text
            text:
              format: "%.0f м/с" 
              args: [x]
  # Давление воды
  - platform: homeassistant
    id: water_pressure_current
    entity_id: "${water_pressure}"
    on_value: 
      then:
        - lvgl.label.update:
            id: water_pressure_text_label
            text:
              format: "%.1f"
              args: ['x']
  # Gate Position sensor
  - platform: homeassistant
    id: gate_position_local
    entity_id: "${gate_position}"
    unit_of_measurement: "%"
    on_value:
      then:
        - lvgl.label.update:
            id: gate_state_label
            text: !lambda |-
              char buf[24];
              if (x < 0.5f) {
                return std::string("Закрыто");
              }
              snprintf(buf, sizeof(buf), "Открыто %.0f%%", x);
              return std::string(buf);
        - lvgl.label.update:
            id: vorota_state_icon
            text_color: !lambda |-
              if (id(gate_position_local).state > 5) {
              return lv_color_hex(0xFF8C00); // darkorange
              }
              return lv_color_hex(0x006400); // darkgreen
            text: !lambda |-
              if (id(gate_position_local).state > 5 && id(gate_position_local).state < 37) {
              return "${gate25_icon}";
              } else if (id(gate_position_local).state > 37 && id(gate_position_local).state < 63) {
              return "${gate50_icon}";
              } else if (id(gate_position_local).state > 63 && id(gate_position_local).state < 87) {
              return "${gate75_icon}";
              } else if (id(gate_position_local).state > 87) {
              return "${gate100_icon}";
              }
              return "${gate0_icon}";

