switch:
    # poliv state
  - platform: homeassistant
    id: poliv_state_local
    entity_id: switch.poliv_gazon
    on_turn_on:
      - lvgl.label.update:
          id: poliv_state_icon
          text_color: color_deep_orange
    on_turn_off:
      - lvgl.label.update:
          id: poliv_state_icon
          text_color: color_misty_blue
    # вытяжка
  - platform: homeassistant
    id: hood_state_local
    entity_id: switch.hood_fan_speed1
    on_turn_on:
      - lvgl.label.update:
          id: hood_state_icon
          text_color: color_deep_orange
    on_turn_off:
      - lvgl.label.update:
          id: hood_state_icon
          text_color: color_misty_blue
    # sauna
  - platform: homeassistant
    id: sauna_local
    entity_id: switch.sauna_ten
    on_turn_on:
      - lvgl.label.update:
          id: sauna_label
          text_color: color_deep_orange
      - lvgl.label.update:
          id: sauna_temperature_label
          text_color: color_deep_orange
    on_turn_off:
      - lvgl.label.update:
          id: sauna_label
          text_color: color_misty_blue
      - lvgl.label.update:
          id: sauna_temperature_label
          text_color: color_misty_blue

  # --- Вытяжка детская ---
  - platform: homeassistant
    id: vent_child_state
    entity_id: switch.child_wc_fan
    on_turn_on:
      - lvgl.animation.start: spin_fan_child    # ← запуск вращения
      - lvgl.widget.update:
          id: vent_child_icon
          text_color: color_deep_orange
    on_turn_off:
      - lvgl.animation.stop: spin_fan_child     # ← остановка
      - lvgl.widget.update:
          id: vent_child_icon
          text_color: color_steel_blue

  # --- Вытяжка подвал ---
  - platform: homeassistant
    id: vent_podval_state
    entity_id: switch.vent_podval_fan
    on_turn_on:
      - lvgl.animation.start: spin_fan_podval
      - lvgl.widget.update:
          id: vent_podval_icon
          text_color: color_deep_orange
    on_turn_off:
      - lvgl.animation.stop: spin_fan_podval
      - lvgl.widget.update:
          id: vent_podval_icon
          text_color: color_steel_blue

  - platform: template
    name: "Touchscreen block"
    id: display_lock_switch
    lambda: |-
      return id(display_lock);
    turn_on_action:
      - lambda: 'id(display_lock) = true;' 
      - lvgl.button.update: 
          id: home_page_btn
          clickable: false
      - lvgl.button.update: 
          id: lights_group_page_btn
          clickable: false
      - lvgl.button.update: 
          id: devices_page_btn
          clickable: false
      - lvgl.button.update: 
          id: settings_page_btn
          clickable: false
      - lvgl.label.update:
          id: lock_status
          text_color: color_green
      - lvgl.label.update:
          id: display_lock_btn
          text_color: color_deep_orange
    turn_off_action:
      - lambda: 'id(display_lock) = false;' 
      - lvgl.button.update: 
          id: home_page_btn
          clickable: true
      - lvgl.button.update: 
          id: lights_group_page_btn
          clickable: true
      - lvgl.button.update: 
          id: devices_page_btn
          clickable: true
      - lvgl.button.update: 
          id: settings_page_btn
          clickable: true
      - lvgl.label.update:
          id: lock_status
          text_color: color_steel_blue
      - lvgl.label.update:
          id: display_lock_btn
          text_color: color_steel_blue
