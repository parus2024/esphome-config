binary_sensor:
  - platform: homeassistant
    id: garage_state_local
    entity_id: binary_sensor.garage_state
    trigger_on_initial_state: true
    on_press:
      - lvgl.label.update:
          id: garage_state_icon
          text_color: color_deep_orange
          text: "${garage_open}"
    on_release:
      - lvgl.label.update:
          id: garage_state_icon
          text_color: darkgreen
          text: "${garage_closed}"
    # vorota state
  # --- Клапан вентиляции спортзал ---
  - platform: homeassistant
    id: valve_sport_state
    entity_id: binary_sensor.sport_vent_valve_state
    on_state:
      - if:
          condition:
            lambda: 'return x;'
          then:
            - lvgl.label.update:
                id: valve_sport_icon
                text_color: color_deep_orange
                text: "${valve_open_icon}"
          else:
            - lvgl.label.update:
                id: valve_sport_icon
                text_color: color_steel_blue
                text: "${valve_closed_icon}"
  # --- Кран воды (подвал) ---
  - platform: homeassistant
    id: water_valve_state
    entity_id: binary_sensor.podval_water_kran_state
    on_state:
      - if:
          condition:
            lambda: 'return x;'  # x == true, если открыт
          then:
            - lvgl.widget.update:
                id: water_valve_icon
                text_color: color_deep_orange
          else:
            - lvgl.widget.update:
                id: water_valve_icon
                text_color: color_steel_blue

