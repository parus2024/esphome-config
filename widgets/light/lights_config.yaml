  light_entity_3: "light.zetton1_e27_15w_ld2420"
  light_entity_4: "light.zetton2_e27_15w_ld2420"

  light_widget_name_1: "light1"
  light_widget_name_2: "light2"
  light_widget_name_3: "light3"
  light_widget_name_4: "light4"

  light_label_name_1: "стена"
  light_label_name_2: "лента"
