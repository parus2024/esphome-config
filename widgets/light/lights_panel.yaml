switch:
  # Уведомление движения
  - platform: homeassistant
    id: holl_spotlight_local
    entity_id: "${holl_spotlight}"
    on_turn_on:
      - lvgl.label.update:
          id: holl_spotlight_label
          text_color: color_deep_orange
          text: "${spotlight_on_icon}"
    on_turn_off:
      - lvgl.label.update:
          id: holl_spotlight_label
          text_color: color_misty_blue
          text: "${spotlight_off_icon}"
lvgl:
  pages:
    - id: lights_group_page
      bg_color: color_slate_blue_gray
      widgets:
        # Рамка гостиная
        - obj:
            id: holl_border
            x: 10 # Смещение контейнера по горизонтали от левого края экрана
            y: 10 # Смещение контейнера по вертикали от верхнего края экрана
            width: 460
            height: 60 # Ширина контейнера (площадка) в пикселях
            align: top_left # Выравнивание контейнера (раскомментировать для центрирования)
            bg_opa: 0          # полностью прозрачный фон
            border_opa: 80%    # полупрозрачная рамка (80 % видимости)
            border_color: color_misty_blue
            border_width: 1
            shadow_opa: 0%      # тень отключена
            pad_all: 0
        - obj:
            id: holl_btn
            x: 10
            y: 10
            width: 180
            height: 60
            align: TOP_LEFT
            bg_color: color_steel_blue
            bg_opa: 20%
            shadow_opa: transp
            border_opa: transp
            scrollable: "OFF"
            radius: 10
            widgets:
              - label:
                  x: 0
                  y: 8
                  id: holl_light1_label
                  align: BOTTOM_LEFT
                  text_color: color_steel_blue
                  text_font: parus_icons_26
                  text: "${lamp1_icon}"
                  on_press:
                    - homeassistant.action:
                        action: switch.toggle
                        data:
                          entity_id: "${holl_light1}"
              - label:
                  x: 0
                  y: 8
                  id: holl_light2_label
                  align: BOTTOM_MID
                  text_color: color_steel_blue
                  text_font: parus_icons_26
                  text: "${lamp1_icon}"
                  on_press:
                    - homeassistant.action:
                        action: switch.toggle
                        data:
                          entity_id: "${holl_light2}"
