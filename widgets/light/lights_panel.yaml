            x: 10
            y: 335
            width: 220
            height: 40
            align: TOP_LEFT
            pad_all: 0
            bg_color: color_steel_blue
            bg_opa: 20%
            border_opa: TRANSP
            border_width: 0
            shadow_opa: TRANSP
            radius: 10
            scrollable: "OFF"
            widgets:
              - label:
                  id: hue_brightness_label
                  x: 10
                  y: 5
                  align: TOP_LEFT
                  text_font: nunito_14
                  text_color: color_misty_blue
                  text: "ЯРКОСТЬ HUE ДВОР"

              - label:
                  id: hue_brightness_value_label
                  x: -10
                  y: 5
                  align: TOP_RIGHT
                  text_font: nunito_16
                  text_color: color_misty_blue
                  text: "128"

              - slider:
                  id: hue_brightness_slider
                  x: 10
                  y: -10
                  width: 200
                  height: 6
                  align: BOTTOM_LEFT
                  min_value: 0
                  max_value: 255
                  value: 128
                  bg_color: color_slate_blue_gray
                  indicator:
                    bg_color: color_misty_blue
                    radius: 5
                  knob:
                    bg_color: color_misty_blue
                  on_value:
                    - lvgl.label.update:
                        id: hue_brightness_value_label
                        text: !lambda |-
                          char buf[8];
                          snprintf(buf, sizeof(buf), "%d", (int)x);
                          return std::string(buf);
                  on_release:
                    - homeassistant.action:
                        action: input_number.set_value
                        data:
                          entity_id: input_number.hue_brightness
                          value: !lambda 'return (int)x;'
                  animated: true
