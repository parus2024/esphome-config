lvgl:
  pages:
    - id: lights_group_page
      bg_color: color_slate_blue_gray
      widgets:

        # ========== СТРОКА 1 (y: 10): Гостиная + стена + цветы + мастер + гараж ==========
        - obj:
#            id: holl_border
            x: 10
            y: 10
            width: 265
            height: 60
            align: top_left
            bg_opa: 0
            border_opa: 80%
            border_color: color_misty_blue
            border_width: 1
            shadow_opa: 0%
            pad_all: 0

        - obj:
            id: holl_btn
            x: 10
            y: 10
            width: 150
            height: 60
            align: TOP_LEFT
            bg_color: color_steel_blue
            bg_opa: 20%
            shadow_opa: transp
            border_opa: transp
            scrollable: "OFF"
            radius: 10
            widgets:
              - label:
                  x: 0
                  y: -18
                  id: holl_label_name
                  align: TOP_MID
                  text_font: nunito_18
                  text_color: color_misty_blue
                  text: "ГОСТИНАЯ"
              - label:
                  x: -10
                  y: 8
                  id: holl_light1_label
                  align: BOTTOM_LEFT
                  text_color: color_steel_blue
                  text_font: parus_icons_26
                  text: "${lamp1_icon}"
                  on_press:
                    - homeassistant.action:
                        action: switch.toggle
