switch:
  - platform: homeassistant
    id: holl_spotlight_local
    entity_id: "${holl_spotlight}"
    on_turn_on:
      - lvgl.label.update:
          id: holl_spotlight_label
          text_color: color_deep_orange
          text: "${spotlight_on_icon}"
    on_turn_off:
      - lvgl.label.update:
          id: holl_spotlight_label
          text_color: color_misty_blue
          text: "${spotlight_off_icon}"
  - platform: homeassistant
    id: sport_spotlight_local
    entity_id: "${sport_spotlight}"
    on_turn_on:
      - lvgl.label.update:
          id: sport_spotlight_label
          text_color: color_deep_orange
          text: "${spotlight_on_icon}"
    on_turn_off:
      - lvgl.label.update:
          id: sport_spotlight_label
          text_color: color_misty_blue
          text: "${spotlight_off_icon}"

sensor:
  - platform: homeassistant
    id: hue_brightness_value
    entity_id: input_number.hue_brightness
    internal: true
    on_value:
      - lvgl.slider.update:
          id: hue_brightness_slider
          value: !lambda 'return x;'
          animated: LV_ANIM_ON
      - lvgl.label.update:
          id: hue_brightness_value_label
          text: !lambda |-
            char buf[8];
            snprintf(buf, sizeof(buf), "%d", (int)x);
            return std::string(buf);
binary_sensor:
  - platform: lvgl
    id: ${light_widget_name_1}_btn_long_sensor
    widget: ${light_widget_name_1}_btn
    on_click:
    - min_length: 50ms
      max_length: 500ms
      then:
        - homeassistant.service:
            service: light.toggle
            data:
              entity_id: "${light_entity_1}"
    - min_length: 800ms
      max_length: 3000ms
      then:
        - lvgl.widget.hide: menu_controls_main
        - lvgl.page.show: 
            id: ${light_widget_name_1}_light_rgb_page
            animation: OUT_RIGHT
            time: 300ms

