lvgl:

  gradients:
    - id: thermostat_temp_gradient
      direction: ver
      dither: none
      stops:
        - color: 0xFF0000   # красный (вверху)
          position: 0
        - color: 0xFF3300
          position: 32
        - color: 0xFF6600
          position: 64
        - color: 0xFF9900
          position: 96
        - color: 0xFFFF00   # жёлтый (середина)
          position: 128
        - color: 0xCCCC33
          position: 160
        - color: 0x666699
          position: 192
        - color: 0x3333CC
          position: 224
        - color: 0x0000FF   # синий (внизу)
          position: 255

  pages:
    - id: thermostat_page
      bg_color: color_slate_blue_gray
      widgets:
        # Объект с идикатором мощности
        - obj:
            id: boiler_31_power_bg
            x: 10
            y: 10
            width: 170
            height: 70
            align: top_left
            pad_all: 0
            bg_color: color_steel_blue
            bg_opa: 20%
            border_opa: transp
            border_width: 0
            shadow_opa: transp
            radius: 10
            widgets:
              - label:
                  id: boiler_31_power_icon_label
                  x: 5                            # Делаем небольшой отступ слева
                  align: left_mid
                  text_font: mdi_icons_40
                  text_color: color_misty_blue
                  text: "${power_icon}"
              - label:
                  id: boiler_31_power_state_label
                  x: 50                             # Делаем отступ от значка
                  align: left_mid
                  text_font: nunito_30
                  text_color: color_misty_blue
                  text: " "                         # Передаем данные из сенсора

        # Объект с идикатором напряжения
        - obj:
            id: boiler_31_voltage_bg
            x: 190
            y: 10
            width: 180
            height: 70
            align: top_left
            pad_all: 0
            bg_color: color_steel_blue
            bg_opa: 20%
            border_opa: transp
            border_width: 0
            shadow_opa: transp
            radius: 10
            widgets:
              - label:
                  id: boiler_31_voltage_icon_label
                  x: 5                             # Делаем небольшой отступ слева
                  align: left_mid
                  text_font: mdi_icons_40
                  text_color: color_misty_blue
                  text: "${voltage_icon}"
              - label:
                  id: boiler_31_voltage_state_label
                  x: 50                             # Делаем отступ от значка
                  align: left_mid
                  text_font: nunito_30
                  text_color: color_misty_blue
                  text: " "                         # Пустое поле, передадим действием

        # Состояние тенов и управление ими
        - obj:
            id: boiler_31_ten_controls
            x: 100
            y: 100
            width: 260
            height: 280
            align: TOP_LEFT
            pad_all: 0
            bg_color: color_steel_blue
            bg_opa: 20%
            border_opa: TRANSP
            border_width: 0
            shadow_opa: TRANSP
            radius: 10
            widgets:
              - obj:
                  id: boiler_31_ten1_bg # Кнопка вкл\выкл ТЕН 1
                  x: 35
                  y: -60
                  align: left_mid
                  width: 70
                  height: 70
                  radius: 35
                  pad_all: 0
                  bg_color: color_deep_orange
                  bg_opa: 20%
                  shadow_opa: transp
                  border_opa: transp
                  border_width: 0
                  widgets:
                    - label:
                        id: boiler_31_ten1_icon
                        align: center
                        text_font: mdi_icons_40
                        text_color: color_deep_orange
                        text: "${heating_coil_icon}"
                    - label:
                        id: boiler_31_ten1_icon_label
                        x: -55
                        align: RIGHT_MID
                        text_font: nunito_20
                        text_color: color_misty_blue
                        text: "1"
                  on_click:
                    - homeassistant.action:
                        action: switch.toggle
                        data:
                          entity_id: "${boiler_31_ten1}"

              - obj:
                  id: boiler_31_ten2_bg # Кнопка вкл\выкл ТЕН 2
                  x: 35
                  y: 60
                  align: left_mid
                  width: 70
                  height: 70
                  radius: 35
                  pad_all: 0
                  bg_color: color_deep_orange
                  bg_opa: 20%
                  shadow_opa: transp
                  border_opa: transp
                  border_width: 0
                  widgets:
                    - label:
                        id: boiler_31_ten2_icon
                        align: center
                        text_font: mdi_icons_40
                        text_color: color_deep_orange
                        text: "${heating_coil_icon}"
                    - label:
                        id: boiler_31_ten2_icon_label
                        x: -55
                        align: RIGHT_MID
                        text_font: nunito_20
                        text_color: color_misty_blue
                        text: "2"
                  on_click:
                    - homeassistant.action:
                        action: switch.toggle
                        data:
                          entity_id: "${boiler_31_ten2}"

        # Режимы работы
        - obj:
            x: 5
            y: -100
            width: 90
            height: 90
            align: left_mid
            pad_all: 0
            bg_opa: transp
            shadow_opa: transp
            border_opa: transp
            widgets:
              - obj:
                  width: 70
                  height: 70
                  align: center
                  clickable: true
                  radius: 50
                  pad_all: 0
                  bg_opa: transp
                  border_opa: transp
                  border_width: 0
                  shadow_width: 8
                  shadow_spread: 2
                  shadow_color: color_black
                  pressed:
                    bg_color: 0x3A3A4C
                    shadow_width: 5
                  on_click:
                    - homeassistant.action:
                        action: switch.toggle
                        data:
                          entity_id: "${boiler_31_full_mode}"
              - obj:
                  width: 60
                  height: 60
                  align: center
                  clickable: false
                  radius: 45
                  pad_all: 0
                  bg_opa: transp 
                  border_opa: transp
                  shadow_width: 4
                  shadow_color: 0xFFFFFF
                  shadow_ofs_x: -4
                  shadow_ofs_y: -2
                  shadow_opa: 30%

              - obj:
                  id: boiler_31_full_mode_bg
                  width: 65
                  height: 65
                  pad_all: 0
                  align: center
                  clickable: false
                  radius: 50
                  border_opa: transp
                  bg_color: color_slate_blue_gray
                  widgets:
                    - label:
                        id: boiler_31_full_mode_icon
                        y: -2
                        align: center
                        text_font: mdi_icons_40
                        text_color: color_misty_blue
                        text: "${all_inclusive}"

        - obj:
            x: 5
            y: 0
            width: 90
            height: 90
            align: left_mid
            pad_all: 0
            bg_opa: transp
            shadow_opa: transp
            border_opa: transp
            widgets:
              - obj:
                  width: 70
                  height: 70
                  align: center
                  clickable: true
                  radius: 50
                  pad_all: 0
                  bg_opa: transp
                  border_opa: transp
                  border_width: 0
                  shadow_width: 8
                  shadow_spread: 2
                  shadow_color: color_black
                  pressed:
                    bg_color: 0x3A3A4C
                    shadow_width: 5
                  on_click:
                    - homeassistant.action:
                        action: switch.toggle
                        data:
                          entity_id: "${boiler_31_day_mode}"

              - obj:
                  width: 60
                  height: 60
                  align: center
                  clickable: false
                  radius: 45
                  pad_all: 0
                  bg_opa: transp 
                  border_opa: transp
                  shadow_width: 4
                  shadow_color: 0xFFFFFF
                  shadow_ofs_x: -4
                  shadow_ofs_y: -2
                  shadow_opa: 30%

              - obj:
                  id: boiler_31_day_mode_bg
                  width: 65
                  height: 65
                  pad_all: 0
                  align: center
                  clickable: false
                  radius: 50
                  border_opa: transp
                  bg_color: color_slate_blue_gray
                  widgets:
                    - label:
                        y: -2
                        id: boiler_31_day_mode_icon
                        align: CENTER
                        text_font: mdi_icons_52
                        text_color: color_misty_blue
                        text: "${weather_sunny}"
        - obj:
            x: 5
            y: 100
            width: 90
            height: 90
            align: left_mid
            pad_all: 0
            bg_opa: transp
            shadow_opa: transp
            border_opa: transp
            widgets:
              - obj:
                  width: 70
                  height: 70
                  align: center
                  clickable: true
                  radius: 50
                  pad_all: 0
                  bg_opa: transp
                  border_opa: transp
                  border_width: 0
                  shadow_width: 8
                  shadow_spread: 2
                  shadow_color: color_black
                  pressed:
                    bg_color: 0x3A3A4C
                    shadow_width: 5
                  on_click:
                    - homeassistant.action:
                        action: switch.toggle
                        data:
                          entity_id: "${boiler_31_night_mode}"

              - obj:
                  width: 60
                  height: 60
                  align: center
                  clickable: false
                  radius: 45
                  pad_all: 0
                  bg_opa: transp 
                  border_opa: transp
                  shadow_width: 4
                  shadow_color: 0xFFFFFF
                  shadow_ofs_x: -4
                  shadow_ofs_y: -2
                  shadow_opa: 30%

              - obj:
                  id: boiler_31_night_mode_bg
                  width: 65
                  height: 65
                  pad_all: 0
                  align: center
                  clickable: false
                  radius: 50
                  border_opa: transp
                  bg_color: color_slate_blue_gray
                  widgets:
                    - label:
                        id: boiler_31_night_mode_icon
                        y: -2
                        align: CENTER
                        text_font: mdi_icons_40
                        text_color: color_misty_blue
                        text: "${weather_night}"

        # Name
        - obj:
            id: thermostat_name
            x: 100
            y: 400
            width: 360
            height: 60
            align: TOP_LEFT
            pad_all: 0
            bg_color: color_steel_blue
            bg_opa: 20%
            border_opa: TRANSP
            border_width: 0
            shadow_opa: TRANSP
            radius: 10
            widgets:
              - label:
                  id: thermostat_name_label
                  x: 20
                  align: LEFT_MID
                  text_font: nunito_36
                  text_color: color_misty_blue
                  text: "Boiler 31"

        # main
        - obj:
            id: thermostat_bg_main
            width: 250
            height: 480
            align: RIGHT_MID
            pad_all: 0
            bg_opa: TRANSP
            scrollable: false
            border_opa: TRANSP
            border_width: 0
            shadow_opa: TRANSP
            radius: 10
            widgets:

              - obj:
                  id: thermostat_bg_placeholder
                  radius: 240
                  x: 235
                  width: 480
                  height: 480
                  align: RIGHT_MID
                  bg_color: color_slate_blue_gray
                  pad_all: 0
                  border_opa: TRANSP
                  border_width: 0
                  shadow_opa: TRANSP

              - obj:
                  id: thermostat_temp_arc_bg
                  radius: 230
                  x: 230
                  width: 460
                  height: 460
                  align: RIGHT_MID
                  bg_grad: thermostat_temp_gradient
                  bg_grad_dir: ver
                  pad_all: 0
                  border_opa: TRANSP
                  border_width: 0
                  shadow_opa: TRANSP

              - meter:
                  id: thermostat_meter
                  x: 200
                  height: 400
                  width: 400
                  border_width: 0
                  bg_color: color_slate_blue_gray
                  align: RIGHT_MID
                  text_color: color_steel_blue
                  scales:
                    - range_from: 10
                      range_to: 80
                      angle_range: 160
                      rotation: 100.0
                      ticks:
                        width: 1
                        count: 70 # Количество деление на диапазон
                        length: 10
                        color: color_white
                        major:
                          stride: 10  # крупная метка каждые 5 делений
                          width: 5
                          length: 15
                          color: color_white
                          label_gap: 15
                      indicators:
                        - tick_style:
                            start_value: 10
                            end_value: 80
                            color_start: color_yellow #Цвет снизу
                            color_end: color_red # Цвет сверху
                            width: 1

              - arc:
                  id: boiler_31_arc_main
                  clickable: false
                  align: RIGHT_MID
                  arc_width: 40
                  x: 235
                  width: 470
                  height: 470
                  min_value: 10
                  max_value: 80
                  adjustable: true
                  adv_hittest: true
                  rotation: 90.0
