# https://esphome.io/components/climate/thermostat.html

substitutions:

  thermostat_name:                "Boiler 31"
  thermostat_temperature_entity: "sensor.boiler_31_temperature"
  boiler_31_state:  "binary_sensor.boiler_31_state"
  boiler_31_ten1:  "switch.boiler_31_ten1" # Тен 1
  boiler_31_ten2:  "switch.boiler_31_ten2" # Тен 2
  boiler_31_power:   "sensor.power_boiler_31"   # Мощность
  boiler_31_voltage: "sensor.voltage_boiler_31" # Напряжение
  boiler_31_current: "sensor.current_boiler_31" # Сила тока
  boiler_31_temperature: "sensor.boiler_31_temperature" # Температура
  boiler_31_temperature_alarm: "number.boiler_31_water_alarm" # Температура отключения
  boiler_31_night_mode:  "switch.boiler_31_night"
  boiler_31_day_mode:  "switch.boiler_31_day"
  boiler_31_full_mode:  "switch.boiler_31_full_on"

  heating_icon:       "\U0000e936"
  temperature_icon:   "\U0000e939"
  pm_home_icon:       "\U000F0826"
  pm_away_icon:       "\U000F1A46"
  heating_coil_icon:  "\U000F1AAF"
  water_boiler_alert: "\U000F11B3"
  water_boiler_auto:  "\U000F1B98"
  weather_night:      "\U000F0594"
  weather_sunny:      "\U000F0599"
  all_inclusive:      "\U000F06BE"
  current_icon:       "\U000F1480"
  voltage_icon:       "\U000F095B"
  power_icon:         "\U000F0241"
  boiler_icon:        "\U000F0F92"


sensor:
    # Значение мощности
  - platform: homeassistant
    id: boiler_31_sensor_power
    entity_id: "${boiler_31_power}"
    on_value:
      - lvgl.label.update:
          id: boiler_31_power_state_label
          text: !lambda |-
            if (isnan(x)) return "N/A";
            char buf[16];
            snprintf(buf, sizeof(buf), "%.0f W", x);
            return buf;
    # Значение напряжения
  - platform: homeassistant
    id: boiler_31_sensor_voltage
    entity_id: "${boiler_31_voltage}"
    on_value:
      - lvgl.label.update:
          id: boiler_31_voltage_state_label
          text: !lambda |-
            if (isnan(x)) return "N/A";
            char buf[16];
            snprintf(buf, sizeof(buf), "%.0f V", x);
            return buf;
#    # Значение силы тока
#  - platform: homeassistant
#    id: boiler_31_sensor_current
#    entity_id: "${boiler_31_current}"
#    on_value:
#      - lvgl.label.update:
#          id: boiler_31_current_state_label
#          text: !lambda |-
#            if (isnan(x)) return "N/A";
#            char buf[16];
#            snprintf(buf, sizeof(buf), "%.1f", x);
#            return buf;
  # Thermostat temperature sensor
  - platform: homeassistant
    id: thermostate_temperature_sensor
    entity_id: "${thermostat_temperature_entity}"

  # Текущая Температура бойлера
  - platform: homeassistant
    id: thermostat_sensor_target_temp
    entity_id: "${boiler_31_temperature}"
    on_value: 
      then:
        - lvgl.arc.update:
            id: boiler_31_arc_main
            value: !lambda 'return x;'

        - lvgl.label.update:
            id: thermostat_target_temperature_whole
            text: !lambda |-
              static char buf[10];
              int whole_part = static_cast<int>(id(thermostat_sensor_target_temp).state);
              snprintf(buf, 10, "%d", whole_part);
              return buf;

        - lvgl.label.update:
            id: thermostat_target_temperature_fraction
            text: !lambda |-
              static char buf[10];
              int whole_part = static_cast<int>(id(thermostat_sensor_target_temp).state);
              int fractional_part = static_cast<int>((id(thermostat_sensor_target_temp).state - whole_part) * 10);
              snprintf(buf, 10, ".%01d", fractional_part);
              return buf;
number:
  # температура бойлера перегрев авария
  - platform: homeassistant
    id: thermostat_sensor_current_temp
    entity_id: "${boiler_31_temperature_alarm}"
    on_value:
      - lvgl.label.update:
          id: thermostat_target_temperature_value
          text: !lambda |-
            char buf[8]; 
            sprintf(buf, "%.1f", x); 
            return std::string(buf);
      - lvgl.arc.update:
          id: boiler_31_arc_alarm_temp
          value: !lambda 'return x;'

binary_sensor:
  - platform: homeassistant
    id: boiler_31_state
    entity_id: "${boiler_31_state}"
    on_press:
      then:
      - lvgl.label.update:
          id: boiler_31_power_state_label
          text_color: color_deep_orange

      - lvgl.meter.update:
          id: thermostat_meter
          text_color: color_deep_orange

      - lvgl.label.update:
          id: heating_status
          text_color: color_deep_orange

      - lvgl.label.update:
          id: boiler_31_state_icon
          text_color: color_deep_orange

      - lvgl.label.update:
          id: thermostat_target_temperature_icon
          text_color: color_deep_orange

      - lvgl.label.update:
          id: thermostat_target_temperature_value
          text_color: color_deep_orange

      - lvgl.label.update:
          id: thermostat_target_temperature_whole
          text_color: color_deep_orange

      - lvgl.label.update:
          id: thermostat_target_temperature_fraction
          text_color: color_deep_orange

      - lvgl.label.update:
          id: thermostat_target_temperature_measurement
          text_color: color_deep_orange
    on_release:
      then:
      - lvgl.label.update:
          id: boiler_31_power_state_label
          text_color: color_steel_blue

      - lvgl.meter.update:
          id: thermostat_meter
          text_color: color_steel_blue

      - lvgl.label.update:
          id: heating_status
          text_color: color_steel_blue

      - lvgl.label.update:
          id: boiler_31_state_icon
          text_color: color_steel_blue

      - lvgl.label.update:
          id: thermostat_target_temperature_icon
          text_color: color_steel_blue

      - lvgl.label.update:
          id: thermostat_target_temperature_value
          text_color: color_steel_blue

      - lvgl.label.update:
          id: thermostat_target_temperature_whole
          text_color: color_steel_blue

      - lvgl.label.update:
          id: thermostat_target_temperature_fraction
          text_color: color_steel_blue

      - lvgl.label.update:
          id: thermostat_target_temperature_measurement
          text_color: color_steel_blue
